<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>INTEL DASH</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>INTEL DASH • ANALYTICS PANEL</header>

<div class="container">

  <div class="input-box">
    <input id="jsonInput" placeholder="Cole aqui o JSON da API..." />
    <button onclick="loadData()">Analisar</button>
  </div>

  <div class="cards">

    <div class="card">
      <h3>👤 Perfil</h3>
      <div class="info" id="profile"></div>
    </div>

    <div class="card">
      <h3>💰 Financeiro</h3>
      <div class="info" id="finance"></div>
    </div>

    <div class="card">
      <h3>📞 Contatos</h3>
      <div class="info" id="contacts"></div>
    </div>

    <div class="card">
      <h3>📍 Endereço</h3>
      <div class="info" id="address"></div>
    </div>

    <div class="card">
      <h3>📊 Score Geral</h3>
      <div class="bar">
        <div class="bar-fill" id="bar"></div>
      </div>
      <div class="info" id="scoreText"></div>
    </div>

    <div class="card">
      <h3>🧠 Estabilidade</h3>
      <div class="info" id="stability"></div>
    </div>

  </div>
</div>

<script src="app.js"></script>

</body>
</html>
