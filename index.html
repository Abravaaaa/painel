<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>INTEL DASH</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
}

.container {
  padding: 20px;
}

input {
  padding: 10px;
  width: 250px;
  border-radius: 8px;
  border: none;
}

button {
  padding: 10px 15px;
  border: none;
  border-radius: 8px;
  background: #38bdf8;
  cursor: pointer;
  margin-left: 10px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-top: 20px;
}

.card {
  background: #1e293b;
  padding: 15px;
  border-radius: 10px;
}

.score-bar {
  width: 100%;
  height: 20px;
  background: #334155;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 10px;
}

.score-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #22c55e, #38bdf8);
  transition: 1s;
}
</style>
</head>

<body>

<div class="container">

<h2>🔎 INTEL DASH</h2>

<input id="cpf" placeholder="Digite o CPF">
<button onclick="buscar()">Buscar</button>

<h3>Score</h3>
<div class="score-bar">
  <div id="scoreFill" class="score-fill"></div>
</div>

<div class="cards">

  <div class="card">
    <h3>👤 Dados</h3>
    <div id="dados"></div>
  </div>

  <div class="card">
    <h3>📞 Contatos</h3>
    <div id="contatos"></div>
  </div>

  <div class="card">
    <h3>📍 Endereço</h3>
    <div id="endereco"></div>
  </div>

</div>

</div>

<script src="app.js"></script>

</body>
</html>
