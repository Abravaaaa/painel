<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>INTEL DASH</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f1115;
  color:#fff;
}

header{
  padding:20px;
  background:#151922;
  display:flex;
  gap:10px;
}

input{
  padding:10px;
  width:220px;
  border-radius:8px;
  border:0;
}

button{
  padding:10px 15px;
  border:0;
  border-radius:8px;
  background:#4f7cff;
  color:#fff;
  cursor:pointer;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  padding:20px;
}

.card{
  background:#1a1f2b;
  padding:15px;
  border-radius:10px;
  min-height:120px;
}

.bar{
  width:100%;
  height:10px;
  background:#333;
  border-radius:10px;
  overflow:hidden;
  margin-top:10px;
}

.fill{
  height:100%;
  width:0%;
  background:#4f7cff;
  transition:.5s;
}

h2{margin:0}
small{opacity:.7}
</style>
</head>

<body>

<header>
<input id="cpfInput" placeholder="CPF">
<button onclick="buscar()">Buscar</button>
</header>

<div class="grid">

<div class="card">
<h2 id="score">Score: 0</h2>
<div class="bar"><div id="fill" class="fill"></div></div>
<div id="perfil"></div>
<div id="idade"></div>
</div>

<div class="card" id="dados"></div>
<div class="card" id="contatos"></div>
<div class="card" id="financeiro"></div>
<div class="card" id="enderecos"></div>
<div class="card" id="qualidade"></div>
<div class="card" id="atividade"></div>
<div class="card" id="rede"></div>

</div>

<script src="script.js"></script>

</body>
</html>
