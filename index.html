<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Consulta CPF</title>

<style>
body {
  font-family: Arial;
  background: #0f1115;
  color: white;
  padding: 30px;
}

input {
  padding: 10px;
  width: 260px;
  border-radius: 8px;
  border: none;
}

button {
  padding: 10px 15px;
  border-radius: 8px;
  border: none;
  background: #00c853;
  color: white;
  cursor: pointer;
}

.card {
  background: #1c1f26;
  padding: 15px;
  border-radius: 10px;
  margin-top: 15px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.label {
  font-size: 12px;
  color: #aaa;
}

.value {
  margin-bottom: 10px;
}

.small {
  font-size: 13px;
  color: #ddd;
  margin-bottom: 5px;
}

.error {
  color: red;
}
</style>
</head>

<body>

<h2>🔎 Consulta CPF</h2>

<input id="cpf" placeholder="CPF" />
<button onclick="buscar()">Buscar</button>

<div id="result"></div>

<script>
async function buscar() {
  const cpf = document.getElementById("cpf").value;
  const box = document.getElementById("result");

  box.innerHTML = "Carregando...";

  try {
    const res = await fetch(`/api/cpf?cpf=${cpf}`);
    const data = await res.json();

    if (data.statusCode !== 200) {
      box.innerHTML = "Erro: " + data.message;
      return;
    }

    const d = data.body;

    box.innerHTML = `
      <div class="card">
        <h3>👤 Dados Pessoais</h3>
        <div>${d.name}</div>
        <div>${d.cpf_masked}</div>
        <div>${d.birth_date}</div>
        <div>${d.federal_status}</div>
      </div>

      <div class="card">
        <h3>📍 Endereço</h3>
        <div>${d.address?.street} ${d.address?.number}</div>
        <div>${d.address?.neighborhood}</div>
        <div>${d.address?.city} - ${d.address?.state}</div>
      </div>

      <div class="card">
        <h3>💰 Financeiro</h3>
        <div>Renda: ${d.income}</div>
        <div>Score: ${d.score?.value || "N/A"} / ${d.score?.range || "N/A"}</div>
      </div>

      <div class="card">
        <h3>📞 Telefones</h3>
        ${(d.phones || []).map(t => `<div>${t}</div>`).join("")}
      </div>

      <div class="card">
        <h3>📧 Emails</h3>
        ${(d.additional_emails || []).map(e => `<div>${e}</div>`).join("")}
      </div>

      <div class="card">
        <h3>👨‍👩‍👧 Parentes</h3>
        ${(d.parentes || []).map(p => `<div>${p.nome} (${p.vinculo})</div>`).join("")}
      </div>

      <div class="card">
        <h3>🏠 Outros Endereços</h3>
        ${(d.all_addresses || []).map(a => `
          <div class="small">
            ${a.street} ${a.number} - ${a.neighborhood} - ${a.city}/${a.state}
          </div>
        `).join("")}
      </div>

      <div class="card">
        <h3>📊 Score Completo</h3>
        <div>CSB8: ${d.serasa_completo?.score?.CSB8}</div>
        <div>CSBA: ${d.serasa_completo?.score?.CSBA}</div>
        <div>Faixa: ${d.serasa_completo?.score?.CSBA_FAIXA}</div>
      </div>
    `;

  } catch (e) {
    box.innerHTML = "Erro na requisição";
  }
}
</script>

</body>
</html>
