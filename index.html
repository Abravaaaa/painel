<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>INTEL DASH</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f1115;
  color: #fff;
}

header {
  padding: 20px;
  text-align: center;
  font-size: 22px;
  background: #151826;
}

.container {
  padding: 20px;
  max-width: 1100px;
  margin: auto;
}

.search {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 8px;
  border: none;
}

button {
  padding: 12px 18px;
  border: none;
  border-radius: 8px;
  background: #4f7cff;
  color: white;
  cursor: pointer;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 15px;
}

.card {
  background: #1a1d2b;
  padding: 15px;
  border-radius: 10px;
}

.score {
  font-size: 28px;
  font-weight: bold;
  color: #4f7cff;
}
</style>
</head>

<body>

<header>🔎 INTEL DASH</header>

<div class="container">

  <div class="search">
    <input id="cpf" placeholder="Digite CPF..." />
    <button onclick="buscar()">Buscar</button>
  </div>

  <div class="score" id="score">Score: --</div>

  <div class="cards">

    <div class="card">
      <h3>👤 Dados</h3>
      <div id="dados"></div>
    </div>

    <div class="card">
      <h3>📞 Contatos</h3>
      <div id="contatos"></div>
    </div>

    <div class="card">
      <h3>📍 Endereço</h3>
      <div id="endereco"></div>
    </div>

    <div class="card">
      <h3>💰 Financeiro</h3>
      <div id="financeiro"></div>
    </div>

    <div class="card">
      <h3>👨‍👩‍👧 Relacionados</h3>
      <div id="parentes"></div>
    </div>

  </div>

</div>

<script src="app.js"></script>
</body>
</html>
