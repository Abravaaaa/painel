<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>INTEL DASH</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f1115;
  color: #fff;
}

header {
  padding: 20px;
  background: #151922;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  letter-spacing: 1px;
}

.container {
  padding: 20px;
  max-width: 1100px;
  margin: auto;
}

.input-box {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 8px;
  border: none;
}

button {
  padding: 12px 18px;
  border: none;
  background: #4f7cff;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
}

.card {
  background: #1a1f2b;
  padding: 15px;
  border-radius: 10px;
}

.card h3 {
  margin-top: 0;
  color: #4f7cff;
}

.bar {
  height: 15px;
  background: #2c3445;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 10px;
}

.bar-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #00c6ff, #4f7cff);
  transition: width 1s ease;
}

.info {
  margin-top: 10px;
  font-size: 14px;
  opacity: 0.9;
}

.list {
  font-size: 13px;
  opacity: 0.85;
  margin-top: 8px;
  line-height: 1.5;
}

@media(max-width: 900px){
  .cards { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<header>INTEL DASH • ANALYTICS PANEL</header>

<div class="container">

  <div class="input-box">
    <input id="jsonInput" placeholder="Cole aqui o JSON da API..." />
    <button onclick="loadData()">Analisar</button>
  </div>

  <div class="cards">

    <div class="card">
      <h3>👤 Perfil</h3>
      <div class="info" id="profile"></div>
    </div>

    <div class="card">
      <h3>💰 Financeiro</h3>
      <div class="info" id="finance"></div>
    </div>

    <div class="card">
      <h3>📞 Contatos</h3>
      <div class="info" id="contacts"></div>
    </div>

    <div class="card">
      <h3>📍 Endereço</h3>
      <div class="info" id="address"></div>
    </div>

    <div class="card">
      <h3>📊 Score Geral</h3>
      <div class="bar"><div class="bar-fill" id="bar"></div></div>
      <div class="info" id="scoreText"></div>
    </div>

    <div class="card">
      <h3>🧠 Estabilidade</h3>
      <div class="info" id="stability"></div>
    </div>

  </div>
</div>

<script>
function calcScore(d) {
  let s = 0;

  if (d.name) s += 10;
  if (d.cpf) s += 10;
  if (d.birth_date) s += 10;

  if (d.phones?.length > 2) s += 15;
  if (d.all_addresses?.length > 1) s += 15;
  if (d.additional_emails?.length > 0) s += 10;

  if (d.income) {
    const r = Number(d.income);
    if (r < 1500) s += 5;
    else if (r < 5000) s += 10;
    else s += 20;
  }

  if (d.serasa_completo) s += 10;
  if (d.parentes?.length) s += 10;

  return Math.min(s, 100);
}

function loadData() {
  const raw = document.getElementById("jsonInput").value;
  const data = JSON.parse(raw);

  const body = data.body || data;

  const score = calcScore(body);

  // PROFILE
  document.getElementById("profile").innerHTML =
    `Nome: ${body.name || "-"}<br>CPF: ${body.cpf_masked || body.cpf}<br>Nascimento: ${body.birth_date || "-"}`;

  // FINANCE
  document.getElementById("finance").innerHTML =
    `Renda: ${body.income || "0"}<br>Poder aquisitivo: ${body.poder_aquisitivo?.PODER_AQUISITIVO || "-"}`;

  // CONTACTS
  document.getElementById("contacts").innerHTML =
    `Telefones: ${body.phones?.length || 0}<br>Emails: ${body.additional_emails?.length || 0}`;

  // ADDRESS
  document.getElementById("address").innerHTML =
    `${body.address?.street || ""} ${body.address?.number || ""}<br>
     ${body.address?.neighborhood || ""}<br>
     ${body.address?.city || ""} - ${body.address?.state || ""}`;

  // SCORE BAR
  document.getElementById("bar").style.width = score + "%";
  document.getElementById("scoreText").innerHTML =
    `Score de completude: ${score}/100`;

  // STABILITY
  let stability = "Baixa";
  if ((body.phones?.length || 0) > 5) stability = "Média";
  if ((body.all_addresses?.length || 0) > 3) stability = "Alta";

  document.getElementById("stability").innerHTML =
    `Classificação: ${stability}`;
}
</script>

</body>
</html>
