<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>INTEL DASH</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f1115;
      color: white;
    }

    header {
      padding: 20px;
      background: #151922;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    input {
      padding: 10px;
      width: 220px;
      border-radius: 8px;
      border: none;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      background: #4f7cff;
      color: white;
      cursor: pointer;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      padding: 20px;
    }

    .card {
      background: #1a1f2b;
      padding: 15px;
      border-radius: 12px;
      min-height: 120px;
    }

    .scoreBox {
      font-size: 30px;
      font-weight: bold;
    }

    .bar {
      width: 100%;
      height: 10px;
      background: #333;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: #4f7cff;
      transition: 0.6s;
    }
  </style>
</head>

<body>

<header>
  <input id="cpfInput" placeholder="Digite o CPF">
  <button onclick="buscar()">Buscar</button>
</header>

<div class="grid">

  <div class="card">
    <div id="score" class="scoreBox">Score: 0</div>
    <div class="bar"><div id="bar" class="bar-fill"></div></div>
    <div id="perfil"></div>
    <div id="idade"></div>
  </div>

  <div class="card" id="dados"></div>

  <div class="card" id="contatos"></div>

  <div class="card" id="financeiro"></div>

</div>

<script src="script.js"></script>
</body>
</html>
